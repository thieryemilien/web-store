<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mi tienda{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
<a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">🛍 Mi Tienda</a>
<div class="navbar-nav flex-row flex-wrap gap-3">
<a class="nav-link" href="{{ url_for('inicio') }}">Catálogo</a>
<a class="nav-link" href="{{ url_for('productos') }}">Administrar productos</a>
<a class="nav-link" href="{{ url_for('clientes') }}">Clientes</a>
<a class="nav-link" href="{{ url_for('carrito') }}">Carrito</a>
<a class="nav-link" href="{{ url_for('pedidos') }}">Pedidos</a>
</div></div></nav>
<main class="container py-4">
{% with mensajes = get_flashed_messages(with_categories=true) %}
{% for categoria, mensaje in mensajes %}<div class="alert alert-{{ categoria }}" role="alert">{{ mensaje }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main><footer class="container pb-4 text-muted small">Proyecto educativo · Flask + HTML + MySQL</footer>
</body></html>
