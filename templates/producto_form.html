{% extends 'base.html' %}{% block title %}Producto{% endblock %}{% block content %}<h1>{{ 'Editar producto' if producto
    else 'Nuevo producto' }}</h1>
<form method="post" class="card p-4 shadow-sm form-width">
    <label class="form-label">Nombre<input class="form-control" name="nombre" required maxlength="150"
            value="{{ producto.nombre if producto else '' }}"></label>
    <label class="form-label">Descripción<textarea class="form-control" name="descripcion"
            rows="3">{{ producto.descripcion if producto else '' }}</textarea></label>
    <label class="form-label">Precio (€)<input class="form-control" type="number" step="0.01" min="0.01" name="precio"
            required value="{{ producto.precio if producto else '' }}"></label>
    <label class="form-check mb-3"><input class="form-check-input" type="checkbox" name="activo" {% if not producto or
            producto.activo %}checked{% endif %}><span class="form-check-label">Activo</span></label>
    <div class="d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-secondary"
            href="{{ url_for('productos') }}">Cancelar</a></div>
</form>{% endblock %}
